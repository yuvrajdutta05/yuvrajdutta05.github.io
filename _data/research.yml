ongoing:

  - year: 2026 
  
    title: "(Master's Dissertation) Fluctuations in p-spin Ising Models"
    supervisor: "Prof. Sumit Mukherjee (Columbia University)"
    description: >
      Derived sharp Berry-Esseen bounds for the global magnetization in the high-temperature regime under broad structural assumptions on the interaction tensor.

  - year: 2026
    title: "Brownian Motion with Drift conditioned to have Restricted L²-Norm"
    supervisor: "Prof. Frank Aurzada (TU Darmstadt)"
    description: >
      Studied Brownian motion with drift conditioned on an atypically small $L^2$-norm, proving convergence of the conditioned process to an Ornstein-Uhlenbeck process independent of the original drift. Derived asymptotics for the small ball probability of the quadratic additive functional via the Bromwich integral and saddle-point techniques. Identified the limiting conditioned process using Girsanov's theorem.


completed:

  - year: 2025
    title: "Entropic Matching for Filtering and Smoothing of Stochastic Differential Equations"
    authors: "Yannick Eich, Yuvraj Dutta, Heinz Koeppl"
    description: >
      Developed a variational inference framework for assumed-density filtering and smoothing of SDEs. Extended classical assumed-density methods beyond standard Gaussian approximations, allowing tractable inference under more general distributional constraints while preserving closed-form parameter dynamics for broad classes of stochastic systems.
 
  - year: 2024
    title: "Bivariate Inverse Gaussian Degradation Processes with Shared Random Effects and an Application to Fatigue Cracks"
    authors: "Yuvraj Dutta, Sandip Barui, Debanjan Mitra, Narayanaswamy Balakrishnan"
    description: >
      Developed a new class of bivariate degradation models based on inverse Gaussian processes coupled through latent shared effects. By introducing a substantially more flexible dependence structure than existing formulations, the framework unifies several commonly used models as special cases and enables data-driven selection of dependence mechanisms within a broad parametric family.
    link: "https://arxiv.org/pdf/2606.04546"
    link_text: "[arXiv]"

